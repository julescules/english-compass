name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: Check JavaScript syntax
        shell: bash
        run: |
          for file in ./*.js ./*.mjs ./tests/*.mjs; do
            node --check "$file"
          done
      - name: Run public release smoke test
        run: node tests/public-smoke.mjs
